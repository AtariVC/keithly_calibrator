name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: keithly-calibrator.exe
          - os: macos-latest
            artifact: keithly-calibrator

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --no-install-package qcustomwidgets
          uv pip install --no-deps qcustomwindow
          uv pip install --no-deps "qcustomwidgets @ git+https://github.com/CrinitusFeles/QCustomWidgets.git"

      - name: Build executable
        run: uv run python to_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          VER=${TAG#v}
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/${TAG}/git-cliff-${VER}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo find . -name "git-cliff" -type f -exec mv {} /usr/local/bin/git-cliff \;

      - name: Generate changelog
        id: cliff
        run: |
          git-cliff --config cliff.toml --latest --strip header > NOTES.md
          {
            echo 'content<<EOF'
            cat NOTES.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
          files: |
            dist/keithly-calibrator.exe/keithly-calibrator.exe
            dist/keithly-calibrator/keithly-calibrator
